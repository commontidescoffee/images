<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Common Tides · Weekly Schedule (Tide Ledger)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07111a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18px 14px 40px;
      font-family: 'DM Sans', sans-serif;
      gap: 14px;
    }

    /* ── UI Controls ─────────────────── */
    .ui-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ui-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #4A9E93;
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(74,158,147,0.3);
      transition: background 0.15s;
    }
    .ui-btn:hover { background: #3a8a7f; }
    .ui-btn.ghost {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: none;
    }
    .ui-btn.ghost:hover { background: rgba(255,255,255,0.1); }
    .ui-hint {
      color: rgba(255,255,255,0.25);
      font-size: 11.5px;
      text-align: center;
    }

    .week-picker {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 9px;
      overflow: hidden;
    }
    .week-arrow {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      width: 36px;
      height: 38px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .week-arrow:hover { background: rgba(74,158,147,0.2); color: #fff; }
    .week-picker-label {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
      padding: 0 14px;
      white-space: nowrap;
      border-left: 1px solid rgba(255,255,255,0.1);
      border-right: 1px solid rgba(255,255,255,0.1);
      line-height: 38px;
      min-width: 110px;
      text-align: center;
    }

    #calStatus {
      display: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      text-align: center;
      max-width: 540px;
    }
    #calStatus.loading { background: rgba(74,158,147,0.15); color: #4A9E93; display: block; }
    #calStatus.success { background: rgba(74,158,147,0.12); color: #5EB3A7; display: block; }
    #calStatus.error   { background: rgba(220,80,80,0.12);  color: #e07070; display: block; }

    #scaleWrap { transform-origin: top center; flex-shrink: 0; }

    /* ── Instagram card 1080×1350 — Tide Ledger ────── */
    .ig-card {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      background: #0B1A26;
      font-family: 'DM Sans', sans-serif;
    }

    .bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* JS-generated film grain tile (baked alpha, no blend modes — html2canvas safe) */
    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-repeat: repeat;
    }

    .card-body {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 50px 80px 132px;
    }

    /* ── Masthead ────────────────────── */
    .hdr {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
      flex-shrink: 0;
    }
    .logo-wrap img {
      height: 64px;
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
      opacity: 0.95;
    }
    .hdr-eyebrow {
      margin-top: 20px;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: 0.24em;
      color: #70C4B8;
      text-transform: uppercase;
      text-indent: 0.24em; /* balance tracking on centered text */
    }
    .hdr-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 104px;
      font-weight: 800;
      color: #FAF7F2;
      line-height: 1.02;
      margin-top: 10px;
      letter-spacing: -0.025em;
    }
    .hdr-title em {
      font-style: normal;
      font-weight: 800;
      color: #70C4B8;
    }
    .week-range {
      margin-top: 14px;
      font-size: 29px;
      font-weight: 500;
      color: rgba(232,220,200,0.72);
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      text-transform: uppercase;
      min-height: 35px;
      outline: none;
    }

    /* Horizon: one sand rule with a half-risen sun */
    .horizon { margin-top: 20px; }

    /* ── The ledger ──────────────────── */
    .days {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .day-row {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 30px;
      min-height: 0;
    }
    .day-row + .day-row { border-top: 2px solid rgba(232,220,200,0.13); }
    .day-row.double { flex: 1.75 1 0; }

    .day-col {
      flex: 0 0 118px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .day-name {
      font-size: 31px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #70C4B8;
    }
    .day-date {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(232,220,200,0.5);
    }

    .day-events {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }
    .event-line {
      display: flex;
      align-items: baseline;
      gap: 28px;
    }

    .venue {
      flex: 1;
      min-width: 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FAF7F2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      outline: none;
      min-height: 52px;
      line-height: 1.2;
    }
    .time {
      flex: 0 0 272px;
      font-size: 31px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(232,220,200,0.88);
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      outline: none;
      min-height: 38px;
      line-height: 1.2;
    }
    .event-line.small .venue { font-size: 35px; min-height: 44px; }
    .event-line.small .time  { font-size: 28px; min-height: 34px; }

    /* Off days: kept in the ledger, styled down */
    .day-row.off .day-name { color: rgba(112,196,184,0.45); }
    .day-row.off .day-date { color: rgba(232,220,200,0.28); }
    .day-row.off .venue {
      font-family: 'DM Sans', sans-serif;
      font-style: italic;
      font-size: 29px;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: rgba(250,247,242,0.38);
      min-height: 38px;
    }
    .day-row.off .time { visibility: hidden; }

    /* ── Footer ──────────────────────── */
    .footer {
      flex-shrink: 0;
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      white-space: nowrap;
    }
    .footer-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(112,196,184,0.55); flex-shrink: 0; }
    .footer-handle {
      font-size: 26px;
      font-weight: 700;
      color: #70C4B8;
      letter-spacing: 0.03em;
    }
    .footer-text {
      font-size: 24px;
      font-weight: 500;
      color: rgba(250,247,242,0.55);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="ui-bar" id="uiBar">
    <div class="week-picker">
      <button class="week-arrow" onclick="shiftWeek(-1)" title="Previous week">&#8592;</button>
      <span class="week-picker-label" id="weekPickerLabel">This Week</span>
      <button class="week-arrow" onclick="shiftWeek(1)" title="Next week">&#8594;</button>
    </div>
    <button class="ui-btn" onclick="loadCalendar()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Pull from Calendar
    </button>
    <button class="ui-btn" onclick="saveImage()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save as PNG
    </button>
    <button class="ui-btn ghost" onclick="clearAll()">Clear</button>
  </div>

  <div id="calStatus"></div>
  <p class="ui-hint" id="uiHint">Choose a week · Pull from Calendar · edit any field · Save as PNG</p>

  <div id="scaleWrap">
    <div class="ig-card" id="igCard">

      <!-- Background: glow, corner tide ripples, bottom tide bands -->
      <svg class="bg-svg" viewBox="0 0 1080 1350" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="glowTop" cx="50%" cy="-8%" r="58%">
            <stop offset="0%"  stop-color="#70C4B8" stop-opacity="0.17"/>
            <stop offset="45%" stop-color="#70C4B8" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="#70C4B8" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="glowBottom" cx="8%" cy="104%" r="46%">
            <stop offset="0%"  stop-color="#2d7a70" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#2d7a70" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1080" height="1350" fill="url(#glowTop)"/>
        <rect width="1080" height="1350" fill="url(#glowBottom)"/>

        <!-- Tide ripples radiating from the top-right corner -->
        <g fill="none" stroke="#4A9E93">
          <circle cx="1080" cy="0" r="74"  stroke-width="2" opacity="0.17"/>
          <circle cx="1080" cy="0" r="128" stroke-width="2" opacity="0.13"/>
          <circle cx="1080" cy="0" r="182" stroke-width="2" opacity="0.10"/>
          <circle cx="1080" cy="0" r="236" stroke-width="2" opacity="0.07"/>
          <circle cx="1080" cy="0" r="290" stroke-width="2" opacity="0.045"/>
        </g>

        <!-- Tide line left on the sand, floating above the bands -->
        <path d="M0,1244 C190,1226 380,1256 570,1240 C760,1224 930,1252 1080,1236"
              fill="none" stroke="#E8DCC8" stroke-width="2" opacity="0.28" stroke-linecap="round"/>

        <!-- Layered tide bands exiting the bottom edge -->
        <path d="M0,1268 C180,1248 340,1288 540,1268 C740,1248 908,1290 1080,1264 L1080,1350 L0,1350 Z"
              fill="#4A9E93" opacity="0.10"/>
        <path d="M0,1296 C200,1316 420,1272 640,1298 C820,1318 962,1286 1080,1302 L1080,1350 L0,1350 Z"
              fill="#70C4B8" opacity="0.12"/>
        <path d="M0,1324 C240,1308 480,1340 720,1322 C880,1310 1000,1330 1080,1320 L1080,1350 L0,1350 Z"
              fill="#071019" opacity="0.85"/>
      </svg>

      <div class="grain" id="grain"></div>

      <div class="card-body">

        <div class="hdr">
          <div class="logo-wrap">
            <img id="logoImg" src="https://raw.githubusercontent.com/commontidescoffee/images/main/logo-03.png" alt="Common Tides Coffee" crossorigin="anonymous">
          </div>
          <p class="hdr-eyebrow">Mobile Craft Coffee · Wilmington NC</p>
          <h1 class="hdr-title" contenteditable="true">This <em>Week</em></h1>
          <p class="week-range" id="weekRange" contenteditable="true"></p>
          <svg class="horizon" width="640" height="26" viewBox="0 0 640 26" fill="none">
            <defs>
              <clipPath id="sunClip"><rect x="300" y="0" width="40" height="17"/></clipPath>
            </defs>
            <line x1="30" y1="17" x2="610" y2="17" stroke="#E8DCC8" stroke-width="2" opacity="0.3"/>
            <circle cx="320" cy="17" r="9" fill="#E8DCC8" opacity="0.55" clip-path="url(#sunClip)"/>
          </svg>
        </div>

        <div class="days" id="daysGrid"></div>

        <div class="footer">
          <span class="footer-handle">@commontidescoffee</span>
          <div class="footer-dot"></div>
          <span class="footer-text">Wilmington, NC</span>
          <div class="footer-dot"></div>
          <span class="footer-text">commontides.com/calendar</span>
        </div>

      </div><!-- .card-body -->
    </div><!-- .ig-card -->
  </div><!-- #scaleWrap -->

  <script>
    const CALENDAR_ID = 'e5d97565d2e53eae215c9b87e2a193617d2f7e019de3c8e6ccb3be0f2ac6ee27@group.calendar.google.com'
    const API_KEY     = 'AIzaSyCSiXr9WwISuQJlIQtdSZ3xEPQsTkv_etY'
    const OFF_PHRASE  = 'Resting with the tides'

    let weekOffset = 0

    // ── Film grain: tiny random tile with baked-in alpha ──
    // (No SVG filters, no blend modes — both are unreliable in html2canvas.)
    ;(function makeGrain() {
      const c = document.createElement('canvas')
      c.width = c.height = 240
      const ctx = c.getContext('2d')
      const img = ctx.createImageData(240, 240)
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255
        img.data[i] = img.data[i+1] = img.data[i+2] = v
        img.data[i+3] = 13 // ~5% grain
      }
      ctx.putImageData(img, 0, 0)
      document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`
    })()

    // ── Build the 7 ledger rows (Mon–Sun) ─────
    const DAY_DEFS = [ ['Mon',1], ['Tue',2], ['Wed',3], ['Thu',4], ['Fri',5], ['Sat',6], ['Sun',0] ]

    function eventLineHTML(venue, time, small) {
      return `
        <div class="event-line${small ? ' small' : ''}">
          <div class="venue" contenteditable="true" data-max="${small ? 35 : 42}">${venue}</div>
          <div class="time" contenteditable="true" data-max="${small ? 28 : 31}">${time}</div>
        </div>`
    }

    function buildRows() {
      document.getElementById('daysGrid').innerHTML = DAY_DEFS.map(([name, num], i) => `
        <div class="day-row" data-day="${num}">
          <div class="day-col">
            <div class="day-name">${name}</div>
            <div class="day-date" data-di="${i}"></div>
          </div>
          <div class="day-events">${eventLineHTML('', '', false)}</div>
        </div>`).join('')
    }
    buildRows()

    // ── Week helpers ──────────────────────────
    function shiftWeek(dir) {
      weekOffset += dir
      updateWeekPickerLabel()
      loadCalendar()
    }

    function updateWeekPickerLabel() {
      const el = document.getElementById('weekPickerLabel')
      if (weekOffset === 0) el.textContent = 'This Week'
      else if (weekOffset === 1) el.textContent = 'Next Week'
      else if (weekOffset === -1) el.textContent = 'Last Week'
      else el.textContent = weekOffset > 0 ? `+${weekOffset} Weeks` : `${weekOffset} Weeks`
    }

    function getWeekBounds() {
      const today = new Date()
      const dow = today.getDay()
      const monday = new Date(today)
      monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + weekOffset * 7)
      monday.setHours(0, 0, 0, 0)
      const sunday = new Date(monday)
      sunday.setDate(monday.getDate() + 6)
      sunday.setHours(23, 59, 59, 999)
      return { monday, sunday }
    }

    // ── Formatters (plain hyphens only — no em/en dashes, brand rule) ──
    function fmtTime(dtStr) {
      if (!dtStr) return ''
      const d = new Date(dtStr)
      let h = d.getHours(), m = d.getMinutes(), ampm = h >= 12 ? 'PM' : 'AM'
      h = h % 12 || 12
      return { txt: m === 0 ? `${h}` : `${h}:${String(m).padStart(2,'0')}`, ampm }
    }

    function fmtRange(startStr, endStr) {
      const s = fmtTime(startStr)
      if (!endStr) return s ? `${s.txt} ${s.ampm}` : ''
      const e = fmtTime(endStr)
      // "8 - 11 AM" when both sides share AM/PM, else "8 AM - 1 PM"
      if (s.ampm === e.ampm) return `${s.txt} - ${e.txt} ${e.ampm}`
      return `${s.txt} ${s.ampm} - ${e.txt} ${e.ampm}`
    }

    function fmtWeekLabel(monday, sunday) {
      const mS = monday.toLocaleDateString('en-US', { month: 'short' })
      const mE = sunday.toLocaleDateString('en-US', { month: 'short' })
      const y  = sunday.getFullYear()
      if (mS === mE) return `${mS} ${monday.getDate()} - ${sunday.getDate()}, ${y}`
      return `${mS} ${monday.getDate()} - ${mE} ${sunday.getDate()}, ${y}`
    }

    function setDayDates(monday) {
      document.querySelectorAll('.day-date').forEach(el => {
        const d = new Date(monday)
        d.setDate(monday.getDate() + Number(el.dataset.di))
        el.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      })
    }

    function setStatus(msg, type) {
      const el = document.getElementById('calStatus')
      el.textContent = msg
      el.className = type
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    // ── Load calendar ─────────────────────────
    async function loadCalendar() {
      const { monday, sunday } = getWeekBounds()
      setStatus('Loading from Google Calendar…', 'loading')

      const url = new URL(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`)
      url.searchParams.set('key', API_KEY)
      url.searchParams.set('timeMin', monday.toISOString())
      url.searchParams.set('timeMax', sunday.toISOString())
      url.searchParams.set('singleEvents', 'true')
      url.searchParams.set('orderBy', 'startTime')
      url.searchParams.set('maxResults', '50')

      try {
        const res = await fetch(url)
        const data = await res.json()

        if (!res.ok) {
          if (res.status === 403) {
            setStatus('API key not authorized for this domain. In Google Cloud Console → Credentials, add "commontidescoffee.github.io/*" to the API key\'s allowed referrers.', 'error')
          } else {
            setStatus(`Calendar error: ${data.error?.message || res.status}`, 'error')
          }
          return
        }

        const events = data.items || []

        // Date-only strings must be parsed as LOCAL midnight (not UTC) or the
        // day rolls back in US timezones.
        function parseDayNum(startStr) {
          if (!startStr) return null
          if (startStr.length === 10) {
            const [y, m, d] = startStr.split('-').map(Number)
            return new Date(y, m - 1, d).getDay()
          }
          return new Date(startStr).getDay()
        }

        const byDay = {}
        events.forEach(ev => {
          const startStr = ev.start?.dateTime || ev.start?.date
          const dayNum = parseDayNum(startStr)
          if (dayNum === null) return
          if (!byDay[dayNum]) byDay[dayNum] = []
          byDay[dayNum].push(ev)
        })

        // Rebuild every row: events where they exist, off styling elsewhere
        document.querySelectorAll('.day-row').forEach(row => {
          const evs = byDay[row.dataset.day] || []
          const box = row.querySelector('.day-events')
          row.classList.remove('off', 'double')

          if (evs.length === 0) {
            row.classList.add('off')
            box.innerHTML = eventLineHTML(OFF_PHRASE, '', false)
            return
          }
          const small = evs.length > 1
          if (small) row.classList.add('double')
          box.innerHTML = evs.map(ev => {
            const loc  = escHtml(ev.summary || ev.location || '')
            const time = escHtml(ev.start?.dateTime ? fmtRange(ev.start.dateTime, ev.end?.dateTime) : '')
            return eventLineHTML(loc, time, small)
          }).join('')
        })

        document.getElementById('weekRange').textContent = fmtWeekLabel(monday, sunday)
        setDayDates(monday)

        document.fonts.ready.then(() => setTimeout(fitAllFields, 50))

        setStatus(`✓ Loaded ${events.length} event${events.length !== 1 ? 's' : ''} · Edit any field before saving`, 'success')
        setTimeout(() => setStatus('', ''), 5000)

      } catch(err) {
        setStatus('Network error — check your internet connection and try again.', 'error')
        console.error(err)
      }
    }

    // ── Auto-shrink text to fit (measure the element itself) ──
    function fitText(el) {
      const text = el.textContent.trim()
      if (!text) { el.style.fontSize = ''; return }

      const MAX = parseInt(el.dataset.max || '46', 10), MIN = 18

      // .venue/.time are flex items: flex-basis overrides width, so flex must
      // be released to 'none' for width:max-content to measure the real text
      el.style.fontSize  = MAX + 'px'
      el.style.flex      = 'none'
      el.style.width     = 'max-content'
      el.style.overflow  = 'visible'
      const textW = el.getBoundingClientRect().width       // sync reflow

      el.style.flex     = ''
      el.style.width    = ''
      el.style.overflow = ''
      const containerW = el.getBoundingClientRect().width  // sync reflow

      // Fits at natural size: clear the inline size so CSS rules (base, .small,
      // .off) control rendering
      if (containerW === 0 || textW <= containerW) { el.style.fontSize = ''; return }

      let size = Math.max(MIN, Math.floor(MAX * containerW / textW * 0.98))
      el.style.fontSize = size + 'px'
      // glyph rounding can leave a 1-2px overflow at extreme shrink; nudge down
      let guard = 4
      while (guard-- > 0 && size > MIN && el.scrollWidth > el.clientWidth) {
        size--
        el.style.fontSize = size + 'px'
      }
    }

    function fitAllFields() {
      document.querySelectorAll('#igCard .venue, #igCard .time').forEach(fitText)
    }

    // Event delegation — survives innerHTML rebuilds; typing over an off day
    // wakes the row back up
    document.getElementById('daysGrid').addEventListener('input', (e) => {
      const t = e.target
      if (!t.classList.contains('venue') && !t.classList.contains('time')) return
      const row = t.closest('.day-row')
      if (row?.classList.contains('off') && t.textContent.trim() !== OFF_PHRASE) {
        row.classList.remove('off')
      }
      fitText(t)
    })

    // ── Clear all ─────────────────────────────
    function clearAll() {
      buildRows()
      const { monday } = getWeekBounds()
      setDayDates(monday)
      setStatus('', '')
    }

    // ── Scale to viewport ─────────────────────
    function scaleCard() {
      const wrap = document.getElementById('scaleWrap')
      const scale = Math.min((window.innerWidth - 28) / 1080, (window.innerHeight - 120) / 1350, 1)
      wrap.style.transform = `scale(${scale})`
      wrap.style.height = Math.round(1350 * scale) + 'px'
      wrap.style.width  = Math.round(1080 * scale) + 'px'
    }
    scaleCard()
    window.addEventListener('resize', scaleCard)

    // ── Save as PNG ───────────────────────────
    async function saveImage() {
      if (document.activeElement?.blur) document.activeElement.blur()
      const uiBar  = document.getElementById('uiBar')
      const uiHint = document.getElementById('uiHint')
      const status = document.getElementById('calStatus')
      const wrap   = document.getElementById('scaleWrap')

      uiBar.style.visibility  = 'hidden'
      uiHint.style.visibility = 'hidden'
      status.style.visibility = 'hidden'

      const prev = { t: wrap.style.transform, h: wrap.style.height, w: wrap.style.width }
      wrap.style.transform = 'scale(1)'
      wrap.style.height = '1350px'
      wrap.style.width  = '1080px'

      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))
      await new Promise(r => setTimeout(r, 100))

      try {
        const canvas = await html2canvas(document.getElementById('igCard'), {
          scale: 2,
          useCORS: true,
          allowTaint: false,
          backgroundColor: '#0B1A26',
          width: 1080,
          height: 1350,
          logging: false,
          imageTimeout: 14000,
        })
        const today = new Date()
        const mm = String(today.getMonth()+1).padStart(2,'0')
        const dd = String(today.getDate()).padStart(2,'0')
        const a = document.createElement('a')
        a.download = `ct-schedule-${mm}${dd}.png`
        a.href = canvas.toDataURL('image/png')
        a.click()
      } catch(e) {
        alert('Could not save image. Try a full-page screenshot instead.\n\n' + e.message)
      }

      wrap.style.transform = prev.t
      wrap.style.height = prev.h
      wrap.style.width  = prev.w
      uiBar.style.visibility  = 'visible'
      uiHint.style.visibility = 'visible'
      status.style.visibility = 'visible'
    }

    // Auto-load on open
    loadCalendar()
  </script>
</body>
</html>
